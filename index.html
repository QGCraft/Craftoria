<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craftoria Teams</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#f4f7f5;--card:#fff;--ink:#0f1a14;--mute:#64736a;--line:#e5ebe7;--accent:#16a34a;--accent2:#4ade80;--on:#fff;--warn:#e11d48;--sh:rgba(15,40,25,.10);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0a0f0c;--card:#121a15;--ink:#ecf4ee;--mute:#8da095;--line:#1f2d25;--accent:#34d27b;--accent2:#a3e635;--on:#05140b;--warn:#fb7185;--sh:rgba(0,0,0,.55);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;background:radial-gradient(900px 520px at 8% -10%,color-mix(in srgb,var(--accent) 17%,transparent),transparent),radial-gradient(800px 520px at 100% 0,color-mix(in srgb,var(--accent2) 13%,transparent),transparent),var(--bg);background-attachment:fixed}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.top>div{max-width:1040px;margin:auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on)}
.hr{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.hero{max-width:1040px;margin:auto;padding:60px 20px 28px;text-align:center}
.hero h1{font-size:clamp(34px,6.5vw,62px);line-height:1.07;margin:0 0 16px;font-weight:800;letter-spacing:-1.8px}
.hero h1 span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0 auto;max-width:540px;color:var(--mute);font-size:18px}
main{max-width:1040px;margin:auto;padding:16px 20px 60px}
h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin:8px 0 16px}
label{font-size:13px;font-weight:600;color:var(--mute);display:block;margin-bottom:6px}
input,textarea{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:16px;outline:0;background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--ink);font:inherit;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.top input{width:190px;border-radius:99px}
.panel,.card{background:var(--card);border:1px solid var(--line);box-shadow:0 1px 2px var(--sh),0 14px 34px -14px var(--sh);border-radius:26px;padding:24px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.card{margin:0;display:flex;flex-direction:column;gap:12px;transition:transform .2s,border-color .2s,box-shadow .2s}
.card::before{content:"";width:40px;height:4px;border-radius:99px;background:var(--tc,var(--accent))}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--tc,var(--accent)) 55%,var(--line));box-shadow:0 20px 44px -14px var(--sh)}
.card h3{margin:0;font-size:20px;letter-spacing:-.3px}
.mute{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;align-items:start}
.stats>div{background:color-mix(in srgb,var(--ink) 4%,transparent);border-radius:20px;padding:16px 18px}
.tag{font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:99px;padding:3px 12px;color:var(--accent)}
.tag.off{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tag.unk{color:var(--mute);background:color-mix(in srgb,var(--ink) 7%,transparent)}
.chip{display:inline-flex;align-items:center;gap:7px;background:color-mix(in srgb,var(--ink) 5%,transparent);border-radius:99px;padding:3px 13px 3px 4px;font-size:14px;font-weight:600}
.av{border-radius:9px;image-rendering:pixelated;background:var(--line);flex:none}
.avw{position:relative;display:inline-flex;flex:none}
.dot{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;background:#22e55a;border:2px solid var(--card);box-shadow:0 0 8px #22e55aaa}
.bars{display:inline-flex;align-items:flex-end;gap:3px;height:20px}
.bars span{width:6px;border-radius:3px}
button,a.btn{font:inherit;font-weight:700;font-size:15px;padding:10px 20px;border:0;border-radius:99px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);cursor:pointer;box-shadow:0 8px 20px -8px var(--accent);transition:transform .15s,filter .15s}
button:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.07)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.ghost:hover:not(:disabled){background:color-mix(in srgb,var(--ink) 6%,transparent)}
button.bad{background:var(--warn);color:#fff;box-shadow:0 8px 20px -8px var(--warn)}
button.sm{padding:5px 14px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
.req{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.banner{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on);padding:14px 22px;border-radius:20px;margin-bottom:20px;font-weight:700;box-shadow:0 12px 28px -12px var(--accent)}
.note{background:color-mix(in srgb,var(--card) 70%,transparent);border:1px dashed var(--line);padding:16px 22px;border-radius:20px;margin-bottom:20px;color:var(--mute)}
#ov,#tdlg{position:fixed;inset:0;background:#0008;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#ov[hidden],#tdlg[hidden],#toast[hidden]{display:none}
#ov .panel,#tdlg .panel{max-width:480px;width:100%;margin:0;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:99px;box-shadow:0 12px 30px var(--sh);z-index:30;font-weight:600}

a.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none}
a.btn.dc{background:#5865f2;color:#fff;box-shadow:0 8px 20px -8px #5865f2}
.g{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#fff;color:#4285f4;font-weight:800;font-size:14px}
.blogo{width:40px;height:40px;object-fit:contain}
.hlogo{width:min(230px,58vw);height:auto;filter:drop-shadow(0 20px 44px color-mix(in srgb,var(--accent) 40%,transparent))}
.emo{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:14px;font-size:22px;background:color-mix(in srgb,var(--tc,var(--accent)) 20%,transparent)}
.mp{border-top:4px solid var(--tc,var(--accent))}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.filters #q{max-width:260px}
button.pick{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;padding:6px 14px;font-size:14px}
button.pick.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent)}
button.sw{width:30px;height:30px;padding:0;border-radius:50%;border:3px solid transparent}
button.sw.on{border-color:var(--ink)}
input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--accent);flex:none}
.task{display:flex;align-items:center;gap:10px;margin:0;color:var(--ink);font-size:15px;font-weight:600}
.task.done{text-decoration:line-through;opacity:.5}
.tag.mt{color:#d97706;background:color-mix(in srgb,#f59e0b 20%,transparent)}
.banner.mt{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1f1300;box-shadow:0 12px 28px -12px #f59e0b}
select{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font:inherit}
</style>
</head>
<body>
<header class="top"><div>
  <div class="brand"><img class="blogo" src="logo.png" alt="Craftoria"><span>Craftoria Teams</span></div>
  <div class="hr">
    <input id="mc" maxlength="16" placeholder="Dein Minecraft-Name" aria-label="Dein Minecraft-Name">
    <span id="auth" class="hr"></span>
  </div>
</div></header>
<section class="hero">
  <img class="hlogo" src="logo.png" alt="Craftoria Logo">
  <h1>Finde dein Team.<br><span>Baut gemeinsam.</span></h1>
  <p>Erstelle ein Team, entdecke alle Projekte und tritt per Anfrage bei.</p>
  <div class="row" id="cta" style="justify-content:center;margin-top:22px"></div>
</section>
<main>
  <section class="panel" id="srv">
    <h2>🖥 Server-Status</h2>
    <div class="stats">
      <div><label>Adresse</label><div class="row"><strong id="srvAddr"></strong><button class="ghost sm" id="srvCopy">Kopieren</button></div></div>
      <div><label>Erreichbarkeit</label><span id="srvState" class="tag unk">Prüfe …</span></div>
      <div><label>Spieler online</label><strong id="srvPl" style="font-size:22px">–</strong></div>
      <div><label>Server-Ping</label><div class="row" style="gap:10px"><span class="bars" id="srvBars"></span><strong id="srvPing" style="font-size:22px">–</strong></div><div class="mute" style="font-size:12px">gemessen vom Status-Dienst aus</div></div>
    </div>
    <div id="srvNames" class="row" style="margin-top:12px"></div>
    <p class="mute" id="srvInfo" style="margin:10px 0 0"></p>
  </section>
  <div id="status"></div>
  <div id="banner"></div>
  <section id="mine"></section>
  <h2>Alle Teams</h2>
  <div class="filters"><input id="q" placeholder="Teams suchen …" aria-label="Teams suchen"><div id="tagbar" class="row"></div></div>
  <div id="grid" class="grid"></div>
</main>
<div id="ov" hidden><div class="panel">
  <h2 id="ovt">Beitritt anfragen</h2>
  <label for="ovm">Nachricht an den Ersteller (optional)</label>
  <textarea id="ovm" rows="3" maxlength="200"></textarea>
  <p class="row"><button id="ovs">Anfrage senden</button><button class="ghost" id="ovc">Abbrechen</button></p>
</div></div>
<div id="tdlg" hidden><div class="panel">
  <h2 id="tfTitle">Team erstellen</h2>
  <label for="tn">Teamname</label><input id="tn" maxlength="40">
  <label for="td" style="margin-top:10px">Beschreibung (Bauprojekt, Ziele, Koordinaten …)</label><textarea id="td" rows="3" maxlength="400"></textarea>
  <label for="tm" style="margin-top:10px">Maximale Mitglieder</label><input id="tm" type="number" min="2" max="50" value="8" style="width:100px">
  <label style="margin-top:12px">Symbol</label><div id="tfEmoji" class="row"></div>
  <label style="margin-top:12px">Farbe</label><div id="tfColor" class="row"></div>
  <label style="margin-top:12px">Tags</label><div id="tfTags" class="row"></div>
  <p class="row" style="margin-top:18px"><button id="tfSave">Speichern</button><button class="ghost" id="tfCancel">Abbrechen</button></p>
</div></div>
<div id="toast" hidden></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, getDocs, query, where, writeBatch, arrayRemove, arrayUnion, deleteField } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== SCHRITT: Hier deine Firebase-Config einfügen (siehe README) ======
const firebaseConfig = {
  apiKey: "AIzaSyDFEVn-Fqff8pYX3LQ9zpyycAkmTRlkLRo",
  authDomain: "minecraftteams-ffdab.firebaseapp.com",
  projectId: "minecraftteams-ffdab",
  storageBucket: "minecraftteams-ffdab.firebasestorage.app",
  messagingSenderId: "882998349973",
  appId: "1:882998349973:web:d5e082a2c613636daecb9c"
};
// ==========================================================================

// Optional: Einladungslink zu eurem Discord, z. B. "https://discord.gg/abcd1234". Leer lassen = kein Button.
const DISCORD_INVITE = "";

const TAGS = ["Bauen", "Redstone", "Farmen", "Technik", "Magie", "Erkunden", "Kampf", "Handel", "Anfängerfreundlich"];
const EMOJIS = ["⛏️", "🏰", "🔥", "⚡", "🌲", "💎", "🐉", "🚀", "🧪", "⚔️", "🌋", "🪄"];
const COLORS = ["#16a34a", "#0ea5e9", "#8b5cf6", "#ec4899", "#f97316", "#eab308", "#ef4444", "#14b8a6"];

const $ = s => document.querySelector(s);
function h(t, a, ...c) {
  const e = document.createElement(t);
  for (const k in a || {}) {
    if (k === "class") e.className = a[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), a[k]);
    else if (a[k] === false || a[k] == null) continue;
    else e.setAttribute(k, a[k] === true ? "" : a[k]);
  }
  for (const x of c.flat(Infinity)) if (x != null && x !== false) e.append(x.nodeType ? x : document.createTextNode(x));
  return e;
}
let onlineSet = new Set();
const isOn = n => onlineSet.has(String(n || "").toLowerCase());
const av = (name, size = 28) => h("span", { class: "avw" },
  h("img", { class: "av", src: "https://mc-heads.net/avatar/" + encodeURIComponent(name || "Steve") + "/" + size * 2, width: size, height: size, alt: "", loading: "lazy", onerror: e => e.target.style.visibility = "hidden" }),
  isOn(name) ? h("span", { class: "dot", title: "Gerade online" }) : null);
const chip = name => h("span", { class: "chip" }, av(name), name);
let tt;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3500); }
const fail = e => toast("Fehler: " + ((e && e.message) || e));
function confirmBtn(label, sure, fn, cls) {
  const b = h("button", { class: cls || "ghost sm", onclick: () => {
    if (!b.dataset.a) { b.dataset.a = "1"; b.textContent = sure; setTimeout(() => { delete b.dataset.a; b.textContent = label; }, 4000); } else fn();
  } }, label);
  return b;
}

try { $("#mc").value = localStorage.getItem("mc") || ""; } catch (e) {}
$("#mc").addEventListener("input", () => { try { localStorage.setItem("mc", $("#mc").value.trim()); } catch (e) {} });
const mcName = () => $("#mc").value.trim();

let me = null, myName = "", teams = [], incoming = [], outgoing = {}, unsubs = [], target = null, fTags = new Set(), onlyFree = false, dlg = null;
const configured = !firebaseConfig.apiKey.startsWith("DEIN");
let auth, db;

// Teams normalisieren (alte Teams mit "members" werden mitgenommen)
function norm(t) {
  const names = { ...(t.names || {}) }; let ids = [...(t.memberIds || [])];
  (t.members || []).forEach(m => { if (!ids.includes(m.id)) ids.push(m.id); if (!names[m.id]) names[m.id] = m.mc; });
  if (!ids.length && t.ownerId) { ids = [t.ownerId]; names[t.ownerId] = t.ownerMc; }
  return { ...t, memberIds: ids, names, tags: t.tags || [], tasks: t.tasks || [], emoji: t.emoji || "⛏️", color: t.color || "#16a34a", max: t.max || 8, desc: t.desc || "" };
}
const clean = t => { const { id, members, ...r } = t; return JSON.parse(JSON.stringify(r)); };
const membersOf = t => t.memberIds.map(id => ({ id, mc: t.names[id] || "?" }));
const myTeam = () => teams.find(t => t.id === me);
const isMember = t => !!me && t.memberIds.includes(me);

const login = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(fail);
const gBtn = (cls) => h("button", { class: cls || "", onclick: login }, h("span", { class: "g" }, "G"), "Mit Google anmelden");

// ====== Rollen, Wartung, Einladungen ======
let invite = null, role = null, admins = [], admSub = false, srvDoc = { manual: false, msg: "", plans: [] }, prevIn = null, lastMaint = 0, pendInvite = null, sound = false;
try { sound = localStorage.getItem("snd") === "1"; } catch (e) {}
try { const j = new URLSearchParams(location.search).get("join"); if (j && j.includes(".")) { const [tid, code] = j.split("."); pendInvite = { tid, code }; } } catch (e) {}
const isAdmin = () => !!(me && role && role.role === "sv-admin");
const fmt = ms => new Date(ms).toLocaleString("de-DE", { dateStyle: "medium", timeStyle: "short" });
function maint() {
  if (srvDoc.manual) return { title: srvDoc.msg || "Wartungsarbeiten", type: "Wartung" };
  const now = Date.now();
  return (srvDoc.plans || []).find(p => p.start <= now && now < p.end) || null;
}
function nextPlan() { const now = Date.now(); return (srvDoc.plans || []).filter(p => p.start > now).sort((a, b) => a.start - b.start)[0] || null; }
function applyMaint() { const m = maint(), st = $("#srvState"); if (m && st) { st.className = "tag mt"; st.textContent = "🛠 Wartung"; } }
function beep() {
  try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
    if (c.resume) c.resume(); o.connect(g); g.connect(c.destination); o.frequency.value = 880; g.gain.value = 0.08; o.start(); o.stop(c.currentTime + 0.18); } catch (e) {}
}
async function saveSrv(fn) {
  const d = JSON.parse(JSON.stringify({ manual: false, msg: "", plans: [], ...srvDoc })); fn(d);
  try { await setDoc(doc(db, "server", "status"), d); return true; } catch (e) { fail(e); return false; }
}
function addPlan() {
  const g = id => $("#" + id).value.trim(), a = new Date($("#adm-start").value).getTime(), b = new Date($("#adm-end").value).getTime();
  if (!g("adm-title") || isNaN(a) || isNaN(b) || b <= a) return toast("Bitte Titel, Beginn und ein Ende nach dem Beginn angeben.");
  saveSrv(d => d.plans.push({ id: Date.now().toString(36), type: $("#adm-type").value, title: g("adm-title"), start: a, end: b, note: g("adm-note") }))
    .then(ok => { if (ok) ["adm-title", "adm-start", "adm-end", "adm-note"].forEach(id => { const el = $("#" + id); if (el) el.value = ""; }); });
}
async function addAdmin() {
  const uid = $("#adm-uid").value.trim(), name = $("#adm-name").value.trim();
  if (uid.length < 10) return toast("Bitte die User-ID der Person einfügen.");
  try { await setDoc(doc(db, "roles", uid), { role: "sv-admin", name }); $("#adm-uid").value = ""; $("#adm-name").value = ""; } catch (e) { fail(e); }
}
function adminPanel() {
  const f = (id, label, el) => h("div", { style: "flex:1;min-width:150px" }, h("label", { for: id }, label), el);
  const plans = [...(srvDoc.plans || [])].sort((a, b) => a.start - b.start);
  return h("div", { class: "panel mp", style: "--tc:#f59e0b" },
    h("h2", {}, "🛠 Server-Verwaltung (sv-admin)"),
    h("div", { class: "row", style: "justify-content:space-between" },
      h("span", {}, "Wartungsmodus: ", h("span", { class: "tag" + (srvDoc.manual ? " mt" : "") }, srvDoc.manual ? "AN" : "aus")),
      h("button", { class: srvDoc.manual ? "" : "bad", onclick: () => saveSrv(d => { d.manual = !d.manual; d.msg = $("#adm-msg").value.trim(); }) }, srvDoc.manual ? "Wartung beenden" : "Wartung jetzt starten")),
    f("adm-msg", "Hinweistext für den manuellen Modus (wird beim Starten übernommen)", h("input", { id: "adm-msg", maxlength: "100", placeholder: "z. B. Server-Neustart", value: srvDoc.msg || "" })),
    h("p", { class: "mute", style: "margin-top:16px" }, "Neuen Plan eintragen (der Server gilt im Zeitraum automatisch als „Wartung“)"),
    h("div", { class: "row" },
      f("adm-type", "Art", h("select", { id: "adm-type" }, h("option", {}, "Wartung"), h("option", {}, "Update"))),
      f("adm-title", "Titel", h("input", { id: "adm-title", maxlength: "60", placeholder: "z. B. Modpack-Update" }))),
    h("div", { class: "row", style: "margin-top:8px" },
      f("adm-start", "Beginn", h("input", { id: "adm-start", type: "datetime-local" })),
      f("adm-end", "Ende", h("input", { id: "adm-end", type: "datetime-local" }))),
    h("div", { style: "margin-top:8px" }, f("adm-note", "Notiz (optional)", h("input", { id: "adm-note", maxlength: "120" }))),
    h("p", {}, h("button", { class: "sm", onclick: addPlan }, "Plan speichern")),
    h("p", { class: "mute" }, "Eingetragene Pläne"),
    plans.length ? plans.map(p => h("div", { class: "req" },
      h("div", {}, h("strong", {}, (p.type === "Update" ? "⬆️ " : "🛠 ") + p.title),
        h("div", { class: "mute" }, fmt(p.start) + " – " + fmt(p.end) + (p.note ? " · " + p.note : "") + (p.end < Date.now() ? " · vorbei" : ""))),
      h("button", { class: "ghost sm", onclick: () => saveSrv(d => d.plans = d.plans.filter(x => x.id !== p.id)) }, "Löschen")))
      : h("div", { class: "mute" }, "Noch keine Pläne."),
    h("p", { class: "mute", style: "margin-top:16px" }, "sv-admins"),
    admins.map(a => h("div", { class: "req" }, h("span", {}, (a.name || "ohne Name") + " ", h("span", { class: "mute" }, a.id.slice(0, 8) + "…")),
      a.id === me ? h("span", { class: "tag" }, "Du") : confirmBtn("Entfernen", "Sicher?", () => deleteDoc(doc(db, "roles", a.id)).catch(fail)))),
    h("div", { class: "row" },
      h("input", { id: "adm-uid", style: "flex:2;min-width:200px", placeholder: "User-ID der Person (Button „ID“ oben rechts)" }),
      h("input", { id: "adm-name", style: "flex:1;min-width:120px", placeholder: "Name" }),
      h("button", { class: "sm", onclick: addAdmin }, "Hinzufügen")));
}

// ====== Moderation (nur sv-admin) ======
async function adminPatch(t, patch) { try { await updateDoc(doc(db, "teams", t.id), patch); toast("Gespeichert."); } catch (e) { fail(e); } }
async function adminDelTeam(t) {
  try {
    const b = writeBatch(db);
    b.delete(doc(db, "teams", t.id)); b.delete(doc(db, "invites", t.id));
    (await getDocs(query(collection(db, "requests"), where("teamId", "==", t.id)))).docs.forEach(d => b.delete(d.ref));
    await b.commit(); toast("Team „" + t.name + "“ gelöscht.");
  } catch (e) { fail(e); }
}
function modBlock(t) {
  const others = membersOf(t).filter(m => m.id !== t.id);
  return h("div", { style: "border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px" },
    h("div", { class: "row" }, h("span", { class: "tag mt" }, "🛡 Moderation"),
      t.desc ? confirmBtn("Beschreibung leeren", "Sicher?", () => adminPatch(t, { desc: "" })) : null,
      confirmBtn("Team löschen", "Wirklich löschen?", () => adminDelTeam(t), "bad sm")),
    others.length ? h("div", { class: "row" }, h("span", { class: "mute" }, "Mitglied entfernen:"),
      others.map(m => h("span", { class: "row", style: "gap:4px" }, chip(m.mc),
        confirmBtn("✕", "Raus?", () => adminPatch(t, { memberIds: arrayRemove(m.id), ["names." + m.id]: deleteField() }))))) : null);
}

const inviteLink = () => location.origin + location.pathname + "?join=" + me + "." + invite.code;
async function makeInvite() {
  const a = new Uint8Array(12); crypto.getRandomValues(a);
  try { await setDoc(doc(db, "invites", me), { code: [...a].map(x => (x % 36).toString(36)).join(""), createdAt: Date.now() }); } catch (e) { fail(e); }
}
function invSection() {
  return [h("p", { class: "mute", style: "margin-top:16px" }, "Einladungslink"),
    invite ? h("div", { class: "row" },
      h("input", { readonly: true, value: inviteLink(), style: "flex:1;min-width:200px", onfocus: e => e.target.select() }),
      h("button", { class: "sm", onclick: () => navigator.clipboard.writeText(inviteLink()).then(() => toast("Link kopiert."), () => toast("Bitte den Link manuell kopieren.")) }, "Kopieren"),
      confirmBtn("Neu erzeugen", "Alter Link wird ungültig – sicher?", makeInvite),
      confirmBtn("Deaktivieren", "Sicher?", () => deleteDoc(doc(db, "invites", me)).catch(fail)))
    : h("div", { class: "row" }, h("button", { class: "sm", onclick: makeInvite }, "Einladungslink erstellen"),
      h("span", { class: "mute" }, "Wer den Link öffnet und sich anmeldet, tritt direkt bei, ohne Anfrage."))];
}
function invitePanel(t) {
  const full = t.memberIds.length >= t.max;
  return h("div", { class: "panel", style: "--tc:" + t.color },
    h("h2", {}, "📨 Einladung: " + t.emoji + " " + t.name),
    h("p", { class: "mute" }, "Ersteller: " + t.ownerMc + " · " + t.memberIds.length + "/" + t.max + " Mitglieder"),
    h("div", { class: "row" },
      h("button", { disabled: full, onclick: joinByInvite }, full ? "Team voll" : "Jetzt beitreten"),
      h("button", { class: "ghost", onclick: () => { pendInvite = null; history.replaceState(null, "", location.pathname); render(); } }, "Ablehnen")));
}
async function joinByInvite() {
  if (!mcName()) { toast("Bitte trage oben zuerst deinen Minecraft-Namen ein."); $("#mc").focus(); return; }
  const { tid, code } = pendInvite, b = writeBatch(db);
  b.set(doc(db, "inviteuse", tid + "_" + me), { teamId: tid, uid: me, code });
  b.update(doc(db, "teams", tid), { memberIds: arrayUnion(me), ["names." + me]: mcName() });
  try { await b.commit(); pendInvite = null; history.replaceState(null, "", location.pathname); toast("Du bist dem Team beigetreten!"); }
  catch (e) { toast("Beitritt nicht möglich: Link ungültig oder abgelaufen, oder das Team ist voll."); }
}

function renderTop() {
  const st = $("#status"), au = $("#auth"), cta = $("#cta"), bn = $("#banner");
  [st, au, cta, bn].forEach(x => x.replaceChildren());
  if (!configured) {
    st.append(h("div", { class: "note" }, "Firebase ist noch nicht eingerichtet. Trage deine Config in der index.html ein (Anleitung in der README)."));
  } else if (!me) {
    au.append(gBtn("sm"));
    cta.append(gBtn());
    st.append(h("div", { class: "note" }, "Du kannst alle Teams ansehen. Zum Erstellen und Beitreten bitte mit Google anmelden."));
  } else {
    au.append(
      h("button", { class: "ghost sm", title: "Ton bei neuer Anfrage", onclick: () => { sound = !sound; try { localStorage.setItem("snd", sound ? "1" : "0"); } catch (e) {} if (sound) beep(); render(); } }, sound ? "🔔" : "🔕"),
      h("button", { class: "ghost sm", title: "Meine User-ID kopieren", onclick: () => navigator.clipboard.writeText(me).then(() => toast("User-ID kopiert."), () => toast(me)) }, "ID"),
      h("span", { class: "mute" }, myName), h("button", { class: "ghost sm", onclick: () => signOut(auth) }, "Logout"));
    if (!myTeam()) cta.append(h("button", { onclick: () => {
      if (!mcName()) { toast("Bitte trage oben zuerst deinen Minecraft-Namen ein."); $("#mc").focus(); return; }
      openDlg(null);
    } }, "＋ Team erstellen"));
  }
  if (DISCORD_INVITE) cta.append(h("a", { class: "btn dc", href: DISCORD_INVITE, target: "_blank", rel: "noopener" }, "💬 Discord beitreten"));
  if (myTeam() && incoming.length) bn.append(h("div", { class: "banner" }, "📬 " + incoming.length + " neue Beitrittsanfrage" + (incoming.length > 1 ? "n" : "") + " für dein Team"));
  const m = maint();
  if (m) bn.append(h("div", { class: "banner mt" }, "🛠 " + (m.title || "Wartungsarbeiten") + (m.end ? " · voraussichtlich bis " + fmt(m.end) : "") + (m.note ? " – " + m.note : "")));
  else { const nx = nextPlan(); if (nx) bn.append(h("div", { class: "note" }, "📅 Geplant: " + nx.type + " „" + nx.title + "“ am " + fmt(nx.start) + " bis " + fmt(nx.end))); }
  if (pendInvite && me) { const t = teams.find(x => x.id === pendInvite.tid); if (t && !isMember(t)) bn.append(invitePanel(t)); }
  if (pendInvite && !me && configured) bn.append(h("div", { class: "note" }, "📨 Du wurdest zu einem Team eingeladen. Bitte oben mit Google anmelden, um beizutreten."));
}

function minePanel(t) {
  const owner = t.id === me, n = t.memberIds.length, done = t.tasks.filter(x => x.done).length;
  return h("div", { class: "panel mp", style: "--tc:" + t.color },
    h("div", { class: "row", style: "justify-content:space-between" },
      h("h2", { style: "margin:0" }, t.emoji + " " + t.name),
      owner ? h("button", { class: "ghost sm", onclick: () => openDlg(t) }, "Bearbeiten") : null),
    h("p", { class: "mute" }, "Mitglieder (" + n + "/" + t.max + ")"),
    membersOf(t).map(m => h("div", { class: "req" }, chip(m.mc),
      m.id === me ? h("span", { class: "tag" }, owner ? "Leitung" : "Du")
      : owner ? confirmBtn("Entfernen", "Sicher?", () => saveTeam(x => { x.memberIds = x.memberIds.filter(i => i !== m.id); delete x.names[m.id]; })) : null)),
    owner ? [
      h("p", { class: "mute", style: "margin-top:16px" }, "Beitrittsanfragen"),
      incoming.length ? incoming.map(r => h("div", { class: "req" },
        h("div", {}, chip(r.mc), r.msg ? h("div", { class: "mute" }, "„" + r.msg + "“") : null),
        h("div", { class: "row" },
          h("button", { disabled: n >= t.max, onclick: () => accept(r) }, "Annehmen"),
          h("button", { class: "ghost", onclick: () => deleteDoc(doc(db, "requests", r.id)).catch(fail) }, "Ablehnen"))))
        : h("div", { class: "mute" }, "Keine offenen Anfragen.")] : null,
    owner ? invSection() : null,
    h("p", { class: "mute", style: "margin-top:16px" }, "Aufgaben (" + done + "/" + t.tasks.length + ")"),
    t.tasks.map(k => h("div", { class: "req" },
      h("label", { class: "task" + (k.done ? " done" : "") },
        h("input", { type: "checkbox", checked: k.done, onchange: () => setTasks(t, ts => ts.map(x => x.id === k.id ? { ...x, done: !x.done } : x)) }), k.text),
      h("button", { class: "ghost sm", title: "Löschen", onclick: () => setTasks(t, ts => ts.filter(x => x.id !== k.id)) }, "✕"))),
    h("div", { class: "row", style: "margin-top:10px" },
      h("input", { id: "task-" + t.id, style: "flex:1;min-width:160px", placeholder: "Neue Aufgabe …", maxlength: "80", onkeydown: e => { if (e.key === "Enter") addTask(t, e.target); } }),
      h("button", { class: "sm", onclick: e => addTask(t, e.target.previousSibling) }, "Hinzufügen")),
    h("p", { style: "margin-top:16px" }, owner
      ? confirmBtn("Team löschen", "Wirklich löschen?", removeTeam, "bad sm")
      : confirmBtn("Team verlassen", "Wirklich verlassen?", () => leave(t), "ghost sm")));
}

function renderGrid() {
  const bar = $("#tagbar"); bar.replaceChildren();
  TAGS.forEach(x => bar.append(h("button", { class: "pick" + (fTags.has(x) ? " on" : ""), onclick: () => { fTags.has(x) ? fTags.delete(x) : fTags.add(x); render(); } }, x)));
  bar.append(h("button", { class: "pick" + (onlyFree ? " on" : ""), onclick: () => { onlyFree = !onlyFree; render(); } }, "Freie Plätze"));
  const q = $("#q").value.trim().toLowerCase();
  const list = teams.filter(t => (!q || (t.name + " " + t.desc + " " + (t.ownerMc || "") + " " + t.tags.join(" ")).toLowerCase().includes(q))
    && [...fTags].every(x => t.tags.includes(x)) && (!onlyFree || t.memberIds.length < t.max))
    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  const g = $("#grid"); g.replaceChildren();
  if (!list.length) g.append(h("p", { class: "mute" }, teams.length ? "Keine Teams passen zu deiner Suche." : "Noch keine Teams. Erstelle das erste!"));
  list.forEach(t => {
    const n = t.memberIds.length; let act = null;
    if (me) {
      if (t.id === me) act = h("span", { class: "tag" }, "Dein Team");
      else if (isMember(t)) act = h("span", { class: "tag" }, "✓ Du bist Mitglied");
      else if (outgoing[t.id]) act = h("div", { class: "row" }, h("span", { class: "tag" }, "Anfrage gesendet"),
        h("button", { class: "ghost sm", onclick: () => deleteDoc(doc(db, "requests", t.id + "_" + me)).catch(fail) }, "Zurückziehen"));
      else act = h("button", { disabled: n >= t.max, onclick: () => openJoin(t) }, n >= t.max ? "Team voll" : "Beitritt anfragen");
    }
    g.append(h("div", { class: "card", style: "--tc:" + t.color },
      h("div", { class: "row", style: "flex-wrap:nowrap" }, h("span", { class: "emo" }, t.emoji), h("h3", {}, t.name)),
      t.tags.length ? h("div", { class: "row" }, t.tags.map(x => h("span", { class: "tag" }, x))) : null,
      h("div", { class: "row" }, h("span", { class: "tag" }, n + "/" + t.max + " Mitglieder"), h("span", { class: "mute" }, "Ersteller:"), chip(t.ownerMc)),
      h("div", { class: "mute" }, t.desc || "Keine Beschreibung."),
      h("div", { class: "row" }, membersOf(t).map(m => chip(m.mc))),
      act,
      isAdmin() && t.id !== me ? modBlock(t) : null));
  });
}

function render() {
  const saved = {}; document.querySelectorAll("[id^=task-],[id^=adm-]").forEach(e => saved[e.id] = e.value);
  const ae = document.activeElement, fid = ae && ae.id, fs = ae && ae.selectionStart;
  renderTop();
  $("#mine").replaceChildren(...(isAdmin() ? [adminPanel()] : []), ...teams.filter(isMember).sort((a, b) => (a.id === me ? -1 : 1)).map(minePanel));
  renderGrid();
  for (const id in saved) { const el = document.getElementById(id); if (el && saved[id]) el.value = saved[id]; }
  if (fid && (fid.startsWith("task-") || fid.startsWith("adm-"))) { const el = document.getElementById(fid); if (el) { el.focus(); try { el.setSelectionRange(fs, fs); } catch (e) {} } }
  applyMaint();
  document.title = (me && myTeam() && incoming.length ? "(" + incoming.length + ") " : "") + "Craftoria Teams";
  const mk = maint() ? 1 : 0; if (mk !== lastMaint) { lastMaint = mk; loadSrv(); }
}
setInterval(render, 30000);
$("#q").addEventListener("input", render);

async function saveTeam(fn) { const t = clean(myTeam()); fn(t); try { await setDoc(doc(db, "teams", me), t); } catch (e) { fail(e); } }
async function setTasks(t, fn) { try { await updateDoc(doc(db, "teams", t.id), { tasks: fn(t.tasks) }); } catch (e) { fail(e); } }
function addTask(t, inp) {
  const v = inp.value.trim(); if (!v) return; inp.value = "";
  setTasks(t, ts => [...ts, { id: Date.now().toString(36), text: v, done: false }]);
}
async function leave(t) {
  try { await updateDoc(doc(db, "teams", t.id), { memberIds: arrayRemove(me), ["names." + me]: deleteField() }); toast("Du hast das Team verlassen."); } catch (e) { fail(e); }
}
async function accept(r) {
  const t = myTeam(); if (t.memberIds.length >= t.max) return toast("Dein Team ist voll.");
  const nt = clean(t); nt.memberIds.push(r.fromUid); nt.names[r.fromUid] = r.mc;
  const b = writeBatch(db); b.set(doc(db, "teams", me), nt); b.delete(doc(db, "requests", r.id));
  try { await b.commit(); } catch (e) { fail(e); }
}
async function removeTeam() {
  const b = writeBatch(db); b.delete(doc(db, "teams", me)); b.delete(doc(db, "invites", me));
  incoming.forEach(r => b.delete(doc(db, "requests", r.id)));
  try { await b.commit(); } catch (e) { fail(e); }
}
function openJoin(t) {
  if (!mcName()) { toast("Bitte trage oben zuerst deinen Minecraft-Namen ein."); $("#mc").focus(); return; }
  target = t; $("#ovt").textContent = "Beitritt zu „" + t.name + "“ anfragen"; $("#ovm").value = ""; $("#ov").hidden = false;
}
$("#ovc").onclick = () => $("#ov").hidden = true;
$("#ovs").onclick = async () => {
  const t = target; $("#ov").hidden = true;
  try {
    await setDoc(doc(db, "requests", t.id + "_" + me), { teamId: t.id, teamName: t.name, fromUid: me, mc: mcName(), msg: $("#ovm").value.trim(), at: Date.now() });
    toast("Anfrage an " + (t.ownerMc || "den Ersteller") + " gesendet.");
  } catch (e) { fail(e); }
};

// Team erstellen / bearbeiten
function drawPick() {
  const fill = (id, items, on, pick, cls, label, st) => $(id).replaceChildren(...items.map(i =>
    h("button", { type: "button", class: "pick " + cls + (on(i) ? " on" : ""), style: st ? st(i) : null, onclick: () => { pick(i); drawPick(); } }, label(i))));
  fill("#tfEmoji", EMOJIS, i => dlg.emoji === i, i => dlg.emoji = i, "", i => i);
  fill("#tfColor", COLORS, i => dlg.color === i, i => dlg.color = i, "sw", () => "", i => "background:" + i);
  fill("#tfTags", TAGS, i => dlg.tags.has(i), i => dlg.tags.has(i) ? dlg.tags.delete(i) : dlg.tags.add(i), "", i => i);
}
function openDlg(t) {
  dlg = { edit: !!t, emoji: t ? t.emoji : EMOJIS[0], color: t ? t.color : COLORS[0], tags: new Set(t ? t.tags : []) };
  $("#tfTitle").textContent = t ? "Team bearbeiten" : "Team erstellen";
  $("#tn").value = t ? t.name : ""; $("#td").value = t ? t.desc : ""; $("#tm").value = t ? t.max : 8;
  drawPick(); $("#tdlg").hidden = false;
}
$("#tfCancel").onclick = () => $("#tdlg").hidden = true;
$("#tfSave").onclick = async () => {
  const name = $("#tn").value.trim(); if (!name) return toast("Bitte gib einen Teamnamen ein.");
  const f = { name, desc: $("#td").value.trim(), max: Math.min(50, Math.max(2, +$("#tm").value || 8)), emoji: dlg.emoji, color: dlg.color, tags: [...dlg.tags] };
  $("#tdlg").hidden = true;
  if (dlg.edit) return saveTeam(t => { Object.assign(t, f); t.max = Math.max(t.max, t.memberIds.length); });
  try {
    await setDoc(doc(db, "teams", me), { ...f, ownerId: me, ownerMc: mcName(), memberIds: [me], names: { [me]: mcName() }, tasks: [], createdAt: Date.now() });
  } catch (e) { fail(e); }
};

// ====== Server-Status ======
const SERVER = "craftoria.funkstelle.net";
async function getJson(url) { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); }
async function fetchStatus() {
  try {
    const d = await getJson("https://api.mcstatus.io/v2/status/java/" + SERVER);
    return { online: !!d.online, version: d.version && d.version.name_clean,
      players: d.players ? { on: d.players.online, max: d.players.max, list: (d.players.list || []).map(p => p.name_clean || p.name_raw) } : null };
  } catch (e) {}
  try {
    const d = await getJson("https://api.mcsrvstat.us/3/" + SERVER);
    return { online: !!d.online, version: d.version,
      players: d.players ? { on: d.players.online, max: d.players.max, list: (d.players.list || []).map(p => p.name) } : null };
  } catch (e) {}
  return null;
}
async function fetchPing() {
  try {
    const d = await getJson("https://mc-api.io/server/JAVA/" + SERVER);
    const v = d.ping != null ? d.ping : d.latency;
    return typeof v === "number" ? Math.round(v) : null;
  } catch (e) { return null; }
}
function showPing(ms) {
  const bars = $("#srvBars"); bars.replaceChildren();
  const lvl = ms == null ? 0 : ms < 60 ? 4 : ms < 120 ? 3 : ms < 200 ? 2 : 1;
  const col = lvl >= 3 ? "var(--accent)" : lvl === 2 ? "#e0a82e" : "var(--warn)";
  for (let i = 1; i <= 4; i++) bars.append(h("span", { style: "height:" + (4 + i * 4) + "px;background:" + (i <= lvl ? col : "var(--line)") }));
  $("#srvPing").textContent = ms == null ? "–" : ms + " ms";
}
async function loadSrv() {
  const st = $("#srvState"), pl = $("#srvPl"), names = $("#srvNames"), info = $("#srvInfo");
  const s = await fetchStatus();
  onlineSet = new Set(s && s.online && s.players ? s.players.list.filter(Boolean).map(n => n.toLowerCase()) : []);
  names.replaceChildren();
  if (!s) {
    st.className = "tag unk"; st.textContent = "Nicht abrufbar"; pl.textContent = "–"; showPing(null);
    info.textContent = "Der Status konnte gerade nicht abgefragt werden. Es wird automatisch erneut versucht.";
    render();
    return;
  }
  const time = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
  if (s.online) {
    st.className = "tag"; st.textContent = "● Online"; fetchPing().then(showPing);
    pl.textContent = s.players ? s.players.on + " / " + s.players.max : "–";
    (s.players ? s.players.list : []).filter(Boolean).slice(0, 20).forEach(n => names.append(chip(n)));
    info.textContent = (s.version ? "Version: " + s.version + " · " : "") + "Zuletzt geprüft: " + time + " Uhr"
      + (s.players && s.players.on > 0 && !s.players.list.length ? " · Spielernamen werden vom Server nicht übermittelt" : "");
  } else {
    st.className = "tag off"; st.textContent = "● Offline"; pl.textContent = "0"; showPing(null);
    info.textContent = "Zuletzt geprüft: " + time + " Uhr";
  }
  render();
}
$("#srvAddr").textContent = SERVER;
$("#srvCopy").onclick = () => navigator.clipboard.writeText(SERVER).then(() => toast("Adresse kopiert."), () => toast(SERVER));
showPing(null);
loadSrv();
setInterval(loadSrv, 60000);


render();
if (configured) {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app); db = getFirestore(app);
  onSnapshot(collection(db, "teams"), s => { teams = s.docs.map(d => norm({ id: d.id, ...d.data() })); render(); }, fail);
  onSnapshot(doc(db, "server", "status"), s => { srvDoc = { manual: false, msg: "", plans: [], ...(s.exists() ? s.data() : {}) }; render(); }, fail);
  onAuthStateChanged(auth, u => {
    unsubs.forEach(f => f()); unsubs = []; incoming = []; outgoing = {}; prevIn = null; invite = null; role = null; admins = []; admSub = false;
    me = u ? u.uid : null; myName = u ? (u.displayName || "") : "";
    if (u) {
      unsubs.push(onSnapshot(query(collection(db, "requests"), where("fromUid", "==", u.uid)),
        s => { outgoing = {}; s.docs.forEach(d => outgoing[d.data().teamId] = d.data()); render(); }, fail));
      unsubs.push(onSnapshot(query(collection(db, "requests"), where("teamId", "==", u.uid)),
        s => { const old = prevIn; incoming = s.docs.map(d => ({ id: d.id, ...d.data() })); prevIn = incoming.length; if (sound && old != null && incoming.length > old) beep(); render(); }, fail));
      unsubs.push(onSnapshot(doc(db, "invites", u.uid), s => { invite = s.exists() ? s.data() : null; render(); }, fail));
      unsubs.push(onSnapshot(doc(db, "roles", u.uid), s => {
        role = s.exists() ? s.data() : null;
        if (isAdmin() && !admSub) { admSub = true; unsubs.push(onSnapshot(collection(db, "roles"), r => { admins = r.docs.map(d => ({ id: d.id, ...d.data() })); render(); }, fail)); }
        render();
      }, fail));
    }
    render();
  });
}
